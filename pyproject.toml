[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = [
    "B008",  # Depends()/Form() in parameter defaults IS the FastAPI idiom
    "B905",  # zip() without strict= — the zipped pairs here are same-length by construction
    "E741",  # single-letter comprehension/lambda vars (l for line/label) are house style
]

[tool.ruff.lint.per-file-ignores]
# Compact `a = 1; b = 2` setup lines and late imports after module-level
# scaffolding are established test-file style; the app itself stays strict.
"tests/*" = ["E702", "E402"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "unit: pure-logic test that never builds the app or drives an HTTP client. `pytest -m unit` is the fast inner loop.",
]

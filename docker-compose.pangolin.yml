# OpenPoolPro behind Pangolin (https://github.com/fosrl/pangolin) on the same
# server. The app joins Pangolin's Docker network and publishes no port, so
# the only way in is through Pangolin.
#
#   1. echo "SECRET_KEY=$(openssl rand -hex 32)" > .env
#   2. docker compose -f docker-compose.pangolin.yml up -d
#   3. In Pangolin, add a resource for your domain on the local site with
#      target  http://openpoolpro:8000
#   4. docker compose -f docker-compose.pangolin.yml logs app | grep "Setup code"
#      then open the resource's URL and enter the code.
#
# If Pangolin's own sign-in protects the resource, add bypass rules for the
# customer pages (/portal/*, /sign/*, /static/*, /branding/*) or customers
# can't open their portal and signing links. See docs/deploy.md.
services:
  app:
    image: dendlomm/openpoolpro:${OPENPOOLPRO_TAG:-latest}
    container_name: openpoolpro
    volumes:
      - ./data:/data
    environment:
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env (openssl rand -hex 32)}
      APP_TZ: ${APP_TZ:-America/New_York}
      # Trust X-Forwarded-For from Pangolin's network. With no published port,
      # only containers on that network can connect at all. Narrow it to the
      # network's own subnet if you like:
      #   docker network inspect pangolin -f '{{(index .IPAM.Config 0).Subnet}}'
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.16.0.0/12}
      COOKIE_SECURE: "1"
      # Optional single sign-on through Pangolin: see docs/deploy.md.
      PROXY_AUTH_SECRET: ${PROXY_AUTH_SECRET:-}
    networks: [pangolin]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  pangolin:
    external: true
    # The network Pangolin's installer creates. Change it if yours differs:
    #   docker network ls
    name: ${PANGOLIN_NETWORK:-pangolin}

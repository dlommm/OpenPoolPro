# CI/CD for OpenPoolPro — self-hosted GitLab (github.com), DOCKER-executor runner.
#
# On every push to main:
#   1. test    — runs the pytest suite natively in a python image.
#   2. release — always (re)build & push the image as `:latest`; when conventional
#                commits since the last tag warrant a version bump, also push the
#                `:vX.Y.Z` image and create the git tag + GitLab Release (via the
#                Releases API, authenticated with the built-in CI_JOB_TOKEN — no
#                extra secret required).
#
# Requirements (see docs/ci-cd.md): a docker-executor runner assigned to this project
# with a reachable docker daemon. Registry auth uses the built-in CI_JOB_TOKEN.

stages:
  - test
  - release

test:
  stage: test
  image: python:3.12-slim
  variables:
    TZ: "America/New_York"
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  before_script:
    # The suite assumes the runner's clock is in the app's default business
    # timezone (APP_TZ=America/New_York): several Today/route-sheet tests seed
    # "today" via date.today() and one test asserts the ET->UTC evening
    # rollover. python:3.12-slim ships no tz database, so date.today() would be
    # UTC and those tests break on the UTC/ET date boundary. Install tzdata and
    # anchor the clock to New York so date.today() matches business_today().
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends tzdata
    - ln -fs /usr/share/zoneinfo/America/New_York /etc/localtime
  cache:
    key:
      files:
        - requirements-dev.txt
    paths:
      - .cache/pip
  script:
    - pip install -r requirements-dev.txt
    - python -m pytest -q

release:
  stage: release
  image: docker:27-cli
  # Serialize releases: two quick merges to main otherwise run concurrent
  # release jobs that compute the SAME version, race to push :latest, and one's
  # duplicate-tag POST /releases 409s the pipeline red for already-shipped code.
  resource_group: release
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  variables:
    GIT_DEPTH: "0" # full history + tags so next-version.sh can read the last tag and commit range
  before_script:
    - apk add --no-cache git curl bash
  script:
    - git fetch --tags --force
    - eval "$(bash scripts/next-version.sh)"
    - echo "computed VERSION=$VERSION BUMP=$BUMP"
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    # Always refresh :latest (carries the baked APP_VERSION). --pull so base
    # image security patches (python:3.12-slim) reach production instead of
    # reusing a months-old cached base on the self-hosted runner.
    - docker build --pull --build-arg APP_VERSION="$VERSION" -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:latest"
    # On a real version bump: push the versioned image and create the tag + Release.
    # POST /releases with a `ref` creates the git tag `$VERSION` at this commit AND the
    # Release, authenticated by JOB-TOKEN. Creating the tag via the API does not spawn a
    # release loop (the rules above only run test/release on branches, not tag pipelines).
    - |
      if [ "$BUMP" != "none" ]; then
        docker tag "$CI_REGISTRY_IMAGE:latest" "$CI_REGISTRY_IMAGE:$VERSION"
        docker push "$CI_REGISTRY_IMAGE:$VERSION"
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --header "Content-Type: application/json" \
          --data "{\"tag_name\":\"$VERSION\",\"ref\":\"$CI_COMMIT_SHA\",\"name\":\"$VERSION\",\"description\":\"Docker image \`$CI_REGISTRY_IMAGE:$VERSION\` (also \`:latest\`). Built from $CI_COMMIT_SHORT_SHA.\"}" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
      else
        echo "No feat/fix/breaking commits since last tag — pushed :latest only, no new release."
      fi

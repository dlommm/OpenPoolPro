# OpenPoolPro from the published image (Docker Hub; the same image is at
# ghcr.io/dlommm/openpoolpro). Put SECRET_KEY in a .env file next to this
# file (openssl rand -hex 32), run `docker compose up -d`, then open the app
# and enter the setup code from `docker compose logs app | grep "Setup code"`.
services:
  app:
    image: dendlomm/openpoolpro:latest
    ports:
      # Loopback-only. The app trusts X-Forwarded-* from the configured proxy,
      # so anything that can reach this port directly can forge the client IP
      # the login rate limiter and audit log key on. Put the reverse proxy in
      # front; don't publish this on 0.0.0.0.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data
    environment:
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      APP_TZ: ${APP_TZ:-America/New_York}
      # Must match the address the reverse proxy connects from (see Dockerfile).
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      # Session cookies are marked Secure (HTTPS-only) by default — correct for
      # the documented TLS-reverse-proxy setup above. Set COOKIE_SECURE=0 in
      # .env ONLY for a deliberately plain-HTTP deployment; logins won't stick
      # over HTTP otherwise.
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
    # Drop everything, then add back only what the entrypoint needs before it
    # gosu's down to PUID:PGID (chown the data dir, then setuid/setgid).
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

{% extends "base.html" %}
{% block title %}Sign in — Coastline Pools{% endblock %}
{% block nav %}{% endblock %}
{% block content %}
<div class="flex min-h-[70vh] flex-col justify-center pb-16">
  <div class="text-center">
    <p class="page-eyebrow">Pool service planner</p>
    <h1 class="font-display text-5xl font-bold uppercase leading-none tracking-wide">Coastline</h1>
    <svg class="waterline mx-auto mt-3 h-2.5 w-36 text-pool" viewBox="0 0 112 10" fill="none" aria-hidden="true">
      <path d="M1 5 C 8 1, 15 1, 22 5 S 36 9, 43 5 S 57 1, 64 5 S 78 9, 85 5 S 99 1, 106 5"
            stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </div>
  {% if error %}<p class="mt-6 text-center font-medium text-safety">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="mt-8 space-y-3">
    <input name="username" placeholder="Username" autofocus autocapitalize="none"
           autocomplete="username" class="field text-center">
    <input type="password" name="password" placeholder="Password"
           autocomplete="current-password" class="field text-center">
    <button class="btn-primary">Sign in</button>
  </form>
</div>
{% endblock %}

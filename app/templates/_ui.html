{# Shared UI macros: icons, page header with waterline signature #}

{% macro icon(name, cls="") %}
<svg class="{{ cls }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {% if name == "route" %}
    <circle cx="6" cy="19" r="2.4"/><circle cx="18" cy="5" r="2.4"/>
    <path d="M8.4 19h6.1a3.5 3.5 0 0 0 0-7h-5a3.5 3.5 0 0 1 0-7h6.1"/>
  {% elif name == "week" %}
    <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>
  {% elif name == "customers" %}
    <circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/>
    <path d="M16 5.5a3 3 0 0 1 0 5.5M17.5 15.5c1.8.7 3 2.2 3 4.5"/>
  {% elif name == "jobs" %}
    <path d="M14.5 6.5a4 4 0 0 1 5-5l-3 3 .7 2.3 2.3.7 3-3a4 4 0 0 1-5 5L9 18a2.1 2.1 0 1 1-3-3z"/>
  {% elif name == "money" %}
    <circle cx="12" cy="12" r="9"/><path d="M12 6.5v11M15 8.8c-.6-1-1.7-1.5-3-1.5-1.7 0-3 .9-3 2.3 0 2.9 6 1.6 6 4.5 0 1.4-1.3 2.3-3 2.3-1.3 0-2.4-.5-3-1.5"/>
  {% elif name == "settings" %}
    <circle cx="12" cy="12" r="3"/>
    <path d="M12 2.8l1.2 2.4 2.6.5 1.9-1.9 1.5 1.5-1.9 1.9.5 2.6 2.4 1.2-1 2-2.6-.4-1.8 2 .6 2.6-2 1-1.7-2.1h-2.6L9.4 21l-2-1 .6-2.6-1.8-2-2.6.4-1-2 2.4-1.2.5-2.6L3.6 8.1l1.5-1.5L7 8.5l2.6-.5z" stroke-width="1.2"/>
  {% elif name == "pin" %}
    <path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/>
  {% elif name == "phone" %}
    <path d="M5 3h4l2 5-2.5 1.5a12 12 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/>
  {% elif name == "camera" %}
    <path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/>
  {% elif name == "check" %}
    <path d="M4 12.5l5 5L20 6.5"/>
  {% elif name == "chevron" %}
    <path d="M9 5l7 7-7 7"/>
  {% elif name == "plus" %}
    <path d="M12 5v14M5 12h14"/>
  {% elif name == "dog" %}
    <path d="M10 5.5 8.5 3H5l-1 3 1.5 2H8M10 5.5h5.5L19 8l2 .8-1 2.2h-3l-1 2v6h-2.5v-3h-5v3H6v-7"/>
  {% elif name == "user" %}
    <circle cx="12" cy="8.2" r="3.5"/><path d="M4.8 20c0-3.6 3.2-6.2 7.2-6.2s7.2 2.6 7.2 6.2"/>
  {% endif %}
</svg>
{% endmacro %}

{% macro page_header(eyebrow, title) %}
<header class="pt-2 pb-3">
  <p class="page-eyebrow">{{ eyebrow }}</p>
  <h1 class="page-title mt-0.5">{{ title }}</h1>
  <svg class="waterline mt-2 h-2.5 w-28 text-pool" viewBox="0 0 112 10" fill="none" aria-hidden="true">
    <path d="M1 5 C 8 1, 15 1, 22 5 S 36 9, 43 5 S 57 1, 64 5 S 78 9, 85 5 S 99 1, 106 5"
          stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </svg>
</header>
{% endmacro %}

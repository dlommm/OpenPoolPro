{% extends "base.html" %}
{% block content %}
{% import "_ui.html" as ui %}
{{ ui.page_header("Job ticket", "Edit job" if j else "New job") }}
<form method="post" class="space-y-3">
  <label class="block"><span class="field-label">Property</span>
    <select name="property_id" class="field">
      {% for p in props %}
      <option value="{{ p.id }}" {{ "selected" if selected == p.id }}>{{ p.customer.name }} — {{ p.label }}</option>
      {% endfor %}
    </select></label>
  <label class="block"><span class="field-label">Title</span>
    <input name="title" value="{{ j.title if j else '' }}" required class="field"></label>
  <label class="block"><span class="field-label">Description</span>
    <textarea name="description" class="field min-h-24 py-2">{{ j.description if j else "" }}</textarea></label>
  <div class="grid grid-cols-3 gap-3">
    <label class="block"><span class="field-label">Priority</span>
      <select name="priority" class="field">
        {% for pr in ["normal","high"] %}<option {{ "selected" if j and j.priority == pr }}>{{ pr }}</option>{% endfor %}
      </select></label>
    <label class="block"><span class="field-label">Labor $</span>
      <input inputmode="decimal" name="labor_dollars"
             value="{{ '%.2f'|format(j.labor_cents / 100) if j else '' }}"
             class="field font-data"></label>
    <label class="block"><span class="field-label">Date</span>
      <input type="date" name="scheduled_date" value="{{ j.scheduled_date or '' if j else '' }}"
             class="field font-data"></label>
  </div>
  <button class="btn-primary">Save</button>
</form>
{% endblock %}

{% extends "base.html" %}
{% block content %}
{% import "_ui.html" as ui %}
{{ ui.page_header("Job ticket", "Edit job" if j else "New job") }}
<form method="post" class="space-y-3">
  {% if template %}<input type="hidden" name="template_id" value="{{ template.id }}">{% endif %}
  <label class="block"><span class="field-label">Property</span>
    <select name="property_id" class="field">
      {% for p in props %}
      <option value="{{ p.id }}" {{ "selected" if selected == p.id }}>{{ p.customer.name }} — {{ p.label }}</option>
      {% endfor %}
    </select></label>
  <label class="block"><span class="field-label">Title</span>
    <input name="title" value="{{ j.title if j else (template.title if template else '') }}" required class="field"></label>
  <label class="block"><span class="field-label">Description</span>
    <textarea name="description" class="field min-h-24 py-2">{{ j.description if j else (template.description if template else "") }}</textarea></label>
  <div class="grid grid-cols-2 gap-3">
    <label class="block"><span class="field-label">Type</span>
      <select name="job_type" class="field">
        <option value="service" {{ "selected" if (j and j.job_type == "service") or (not j and (not template or template.job_type == "service")) }}>Service</option>
        <option value="repair" {{ "selected" if (j and j.job_type == "repair") or (not j and template and template.job_type == "repair") }}>Repair</option>
      </select></label>
    <label class="block"><span class="field-label">Assigned to</span>
      <select name="assigned_tech_id" class="field">
        <option value="">— Unassigned —</option>
        {% for t in assignees_all %}
        <option value="{{ t.id }}" {{ "selected" if j and j.assigned_tech_id == t.id }}>{{ t.name }}</option>
        {% endfor %}
      </select></label>
  </div>
  <div class="grid grid-cols-3 gap-3">
    <label class="block"><span class="field-label">Priority</span>
      <select name="priority" class="field">
        {% for pr in ["normal","high"] %}<option {{ "selected" if j and j.priority == pr }}>{{ pr }}</option>{% endfor %}
      </select></label>
    {% if show_money %}
    <label class="block"><span class="field-label">Labor $</span>
      <input inputmode="decimal" name="labor_dollars"
             value="{{ '%.2f'|format(j.labor_cents / 100) if j else ('%.2f'|format(template.labor_cents / 100) if template else '') }}"
             class="field font-data"></label>
    {% endif %}
    <label class="block"><span class="field-label">Date</span>
      <input type="date" name="scheduled_date" value="{{ j.scheduled_date or '' if j else '' }}"
             class="field font-data"></label>
  </div>
  <button class="btn-primary">Save</button>
</form>
{% endblock %}

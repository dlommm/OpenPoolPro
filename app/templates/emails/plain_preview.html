{#- Settings preview of a plain-text-only email (what a customer's mail app shows). -#}
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ mail.subject }}</title></head>
<body style="margin:0;padding:0;background-color:#FFFFFF;color:#0E2A3B;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
<div style="padding:12px 16px;border-bottom:1px solid #EEEAE2;font-size:13px;line-height:1.5;color:#52626B;">
  <b style="color:#0E2A3B;">{{ meta.from }}</b> &middot; to {{ meta.to }}<br>
  <span style="font-size:15px;font-weight:600;color:#0E2A3B;">{{ mail.subject }}</span>
</div>
<pre style="margin:0;padding:16px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word;">{{ mail.text }}</pre>
</body>
</html>

{% extends "base.html" %}
{% block title %}Customers{% endblock %}
{% block content %}
<div class="flex items-center justify-between mb-3">
  <h1 class="text-xl font-bold">Customers</h1>
  <a href="/customers/new" class="min-h-11 px-4 flex items-center rounded-lg bg-sky-800 text-white font-semibold">+ Add</a>
</div>
<input type="search" name="q" value="{{ q }}" placeholder="Search"
       hx-get="/customers" hx-trigger="input changed delay:300ms" hx-target="#results"
       hx-select="#results" hx-swap="outerHTML"
       class="w-full min-h-11 rounded-lg border border-slate-300 px-3 mb-3">
<div id="results" class="space-y-2">
  {% for c in customers %}
  <a href="/customers/{{ c.id }}" class="block bg-white rounded-lg p-3 min-h-11 shadow-sm">
    <div class="font-semibold">{{ c.name }}</div>
    <div class="text-sm text-slate-500">{{ c.phone }}</div>
  </a>
  {% else %}<p class="text-slate-500">No customers.</p>{% endfor %}
</div>
{% endblock %}

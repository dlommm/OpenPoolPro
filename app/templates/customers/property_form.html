{% extends "base.html" %}
{% block content %}
{% import "_ui.html" as ui %}
{{ ui.page_header("Customer file", ("Edit property — " if p else "New property — ") ~ customer.name) }}
<form method="post" class="space-y-3">
  <label class="block"><span class="field-label">Label</span>
    <input name="label" value="{{ p.label if p else 'Home' }}" class="field"></label>
  <label class="block"><span class="field-label">Address</span>
    <input name="address" value="{{ p.address if p else '' }}" class="field"></label>
  <div class="grid grid-cols-2 gap-3">
    <label class="block"><span class="field-label">Gate code</span>
      <input name="gate_code" value="{{ p.gate_code if p else '' }}" class="field font-data"></label>
    <label class="block"><span class="field-label">Dog note</span>
      <input name="dog_note" value="{{ p.dog_note if p else '' }}" class="field"></label>
  </div>
  <label class="flex min-h-11 items-center gap-2"><input type="checkbox" name="dog_warning"
         {{ "checked" if p and p.dog_warning }} class="h-5 w-5 rounded border-seam text-pool"> Dog on property</label>
  <div class="grid grid-cols-2 gap-3">
    <label class="block"><span class="field-label">Frequency</span>
      <select name="frequency" class="field">
        {% for f in ["weekly","biweekly","every4weeks","none"] %}
        <option value="{{ f }}" {{ "selected" if p and p.frequency == f }}>{{ f }}</option>
        {% endfor %}
      </select></label>
    <label class="block"><span class="field-label">Day</span>
      <select name="weekday" class="field">
        {% for i, d in [(0,"Mon"),(1,"Tue"),(2,"Wed"),(3,"Thu"),(4,"Fri"),(5,"Sat"),(6,"Sun")] %}
        <option value="{{ i }}" {{ "selected" if p and p.weekday == i }}>{{ d }}</option>
        {% endfor %}
      </select></label>
  </div>
  <div class="grid grid-cols-2 gap-3">
    <label class="block"><span class="field-label">Anchor date (first visit)</span>
      <input type="date" name="anchor_date" value="{{ p.anchor_date or '' if p else '' }}" class="field font-data"></label>
    <label class="block"><span class="field-label">Rate override $ (blank = tier)</span>
      <input inputmode="decimal" name="rate_override_dollars"
             value="{{ '%.2f'|format(p.rate_override_cents / 100) if p and p.rate_override_cents is not none else '' }}"
             class="field font-data"></label>
  </div>
  <label class="block"><span class="field-label">Notes</span>
    <textarea name="notes" class="field min-h-24 py-2">{{ p.notes if p else "" }}</textarea></label>
  <button class="btn-primary">Save</button>
</form>

{% if p %}
<form method="post" action="/properties/{{ p.id }}/deactivate" class="mt-3">
  <button class="btn-danger">Deactivate property</button>
</form>
{% endif %}
{% endblock %}

{# Light/dark toggle wiring — included once by base.html. Binds every
   [data-mode-toggle] on the page. The head script in base.html applies the
   stored mode before first paint (window.__applyMode); this flips it on
   click and stores it per device. #}
<script nonce="{{ csp_nonce() }}">
(function () {
  var root = document.documentElement;
  document.addEventListener("click", function (e) {
    var t = e.target.closest && e.target.closest("[data-mode-toggle]");
    if (!t) return;
    e.preventDefault();
    var next = root.classList.contains("dark") ? "light" : "dark";
    try { localStorage.setItem("mode", next); } catch (err) {}
    if (window.__applyMode) window.__applyMode();
    else { root.classList.toggle("dark", next === "dark"); root.classList.toggle("light", next !== "dark"); }
  });
})();
</script>

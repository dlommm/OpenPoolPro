<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline — Coastline Pools</title>
<!--
  Precached by sw.js (cpp-static-v3) and served as the last-resort fallback
  when a navigation fails offline and there's no cached copy of the page
  being requested. app.css is only a runtime cache, not guaranteed to be
  present, so every style here is inline -- self-contained, no external
  resources, CSP-safe (default-src 'self'; style-src 'self' 'unsafe-inline').
-->
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-top: max(24px, env(safe-area-inset-top));
    padding-bottom: max(24px, env(safe-area-inset-bottom));
    background: #F6F9FA; /* --color-tile */
    color: #0B2A33;      /* --color-ink */
    font-family: -apple-system, "IBM Plex Sans", system-ui, sans-serif;
    text-align: center;
  }
  .card {
    max-width: 24rem;
    width: 100%;
    padding: 28px 20px;
    border: 1px solid #D8E4E7;   /* --color-seam */
    border-radius: 12px;
    background: #ffffff;
    box-shadow: 0 1px 2px rgba(11, 42, 51, 0.06), 0 4px 12px rgba(11, 42, 51, 0.04);
  }
  h1 {
    margin: 0 0 10px;
    font-family: "Barlow Condensed", system-ui, sans-serif;
    font-weight: 700;
    font-size: 22px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  p {
    margin: 0;
    font-size: 15px;
    line-height: 1.4;
    color: #5C7A82; /* --color-mist */
  }
</style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p>You're offline — cached pages still work from the menu.</p>
  </div>
</body>
</html>

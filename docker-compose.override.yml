# Local DEV overrides — auto-merged by `docker compose` in this directory.
# Live-mounts ./app so template + CSS (app/static/app.css, rebuilt via
# `python scripts/build_css.py`) changes show up on refresh without rebuilding
# the image; uvicorn --reload restarts on Python edits. Production deploys use
# docker-compose.unraid.yml instead and are unaffected by this file.
services:
  app:
    volumes:
      - ./data:/data
      - ./app:/srv/app
    environment:
      RUN_SCHEDULER: "0"
      APP_VERSION: dev
    command:
      - uvicorn
      - app.main:create_app
      - --factory
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /srv/app
